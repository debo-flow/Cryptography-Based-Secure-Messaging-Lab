name: V1.0.0 CI Pipeline & Security Audit

on:
  push:
    branches: [ "main", "release/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Code Quality & Linting (Ruff)
      run: |
        ruff check core/ tests/ app.py

    - name: Static Security Analysis (Bandit)
      run: |
        # Ignore asserts in tests, focus on core cryptographic implementations
        bandit -r core/ app.py -ll

    - name: Supply Chain Dependency Audit (pip-audit)
      run: |
        pip-audit -r requirements.txt

    - name: Execute Full Pytest Suite & Coverage
      run: |
        pytest tests/ -v --cov=core --cov-report=xml --cov-fail-under=85

    - name: Upload Coverage Report
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
